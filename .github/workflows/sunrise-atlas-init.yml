name: Bootstrap Sunrise Atlas (.smod)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sunrise-atlas-init.yml"

jobs:
  init-smod:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Install cargo-sunrise-mod
        run: |
          cargo install --locked --git https://github.com/sunrise-org/sunrise cargo-sunrise-mod

      - name: Dump ClientHost & Drawing API + Build Starter .smod
        run: |
          set +e
          git clone --depth 1 --branch preview-2026.11.23.4 https://github.com/starling-client/starling.git starling

          cargo sunrise-mod new atlas --template native
          (cd atlas && cargo sunrise-mod check)

          API="atlas/.sunrise/sdk/api/crates/sunrise-mod-api/src"
          {
            echo "=== API FILES ==="
            find "$API" -type f | sort
            echo ""
            echo "=== CLIENTHOST TRAIT ==="
            grep -rn -A 3 "pub trait ClientHost" "$API"
            for f in $(grep -rl "pub trait ClientHost" "$API"); do
              echo "----- $f -----"
              grep -n "fn " "$f" | head -n 140
            done
            echo ""
            echo "=== DYNAMIC TEXTURES DOC ==="
            [ -f starling/docs/design/mod-api/dynamic-textures.md ] && head -n 120 starling/docs/design/mod-api/dynamic-textures.md
            echo ""
            echo "=== GUI LAYER & SCREEN DRAW EVENTS ==="
            grep -rn -A 25 "pub struct GuiLayerDrawEvent\|pub struct ScreenRenderPostEvent\|pub struct ClientTickPreEvent\|pub struct InputKeyEvent" "$API"
            echo ""
            echo "=== LEVEL / BLOCK / TEXTURE / SCREEN METHODS ==="
            grep -rn "fn " "$API" | grep -iE "block|player|dimension|screen|texture|draw|fill|text|chunk" | head -n 140
          } > sunrise-client-api.txt

          echo "=== BUILDING STARTER .smod ==="
          (cd atlas && cargo sunrise-mod build 2>&1) | tee build-starter.log
          find atlas/target -name "*.smod" -exec cp {} ./atlas-hello.smod \;
          ls -lh sunrise-client-api.txt build-starter.log atlas-hello.smod

      - name: Upload Client API & Starter .smod
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-client-api
          path: |
            sunrise-client-api.txt
            build-starter.log
            atlas-hello.smod
          if-no-files-found: ignore
