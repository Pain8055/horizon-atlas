name: Bootstrap Sunrise Atlas (.smod)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sunrise-atlas-init.yml"

jobs:
  init-smod:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Install cargo-sunrise-mod
        run: |
          cargo install --locked --git https://github.com/sunrise-org/sunrise cargo-sunrise-mod

      - name: Dump Generated ClientHost, Draw & Level Signatures
        run: |
          set +e
          git clone --depth 1 --branch preview-2026.11.23.4 https://github.com/starling-client/starling.git starling
          cargo sunrise-mod new atlas --template native
          (cd atlas && cargo sunrise-mod check)

          SDK="atlas/.sunrise/sdk/api"
          {
            echo "=== DYNAMIC TEXTURES HOW-TO ==="
            [ -f starling/docs/modding/src/how-to/client/dynamic-textures.md ] && cat starling/docs/modding/src/how-to/client/dynamic-textures.md
            echo ""
            echo "=== WIDGET_SCREEN IMPL HOOKS ==="
            [ -f starling/docs/modding/examples/src/widget_screen.rs ] && tail -n +75 starling/docs/modding/examples/src/widget_screen.rs
            echo ""
            echo "=== SDK CRATES ==="
            find "$SDK" -maxdepth 3 -type f -name "*.rs" | sort | head -n 80
            echo ""
            echo "=== CLIENTHOST & DRAW METHODS ==="
            grep -rn "pub trait ClientHost\|pub trait Host\|pub struct DrawContext\|pub struct GuiLayerDrawEvent\|pub struct ScreenRenderPostEvent\|pub struct ClientTickPreEvent\|pub struct InputKeyEvent\|pub struct RegisterGuiLayersEvent" "$SDK" | head -n 40
            echo ""
            echo "=== HOOKS SIGNATURES (HUD/SCREEN/KEY/TICK/CMD) ==="
            grep -rn -A 5 "fn gui_layer_draw\|fn register_gui_layers\|fn screen_render_post\|fn screen_mouse_\|fn input_key\|fn client_tick_pre\|fn register_client_commands\|fn command(" "$SDK" | head -n 120
            echo ""
            echo "=== CLIENTHOST METHODS (PLAYER/LEVEL/BLOCK/TEXTURE/SCREEN) ==="
            grep -rn "fn " "$SDK" | grep -iE "local_player|player_pos|camera|block_state|client_level|mod_screen|open_mod_screen|close_screen|dynamic_texture|gui_size|window_size|sprite|fill\(|text\(" | head -n 140
          } > sunrise-host-sigs.txt
          ls -lh sunrise-host-sigs.txt

      - name: Upload Host Signatures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-host-sigs
          path: sunrise-host-sigs.txt
