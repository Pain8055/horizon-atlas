name: Inspect Starling Preview 4 Mod API

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-starling.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Starling Preview 4 (shallow)
        run: |
          git clone --depth 1 --branch preview-2026.11.23.4 https://github.com/starling-client/starling.git starling

      - name: Check Import and Compile v2 Format
        run: |
          {
            echo "=== IMPORT FILES ==="
            find starling -name "*import*.rs" -o -name "*native_build*.rs" | sort
            echo ""
            echo "=== IMPORT.RS SNIPPET ==="
            for f in $(find starling -name "*import*.rs" | head -n 3); do
              echo "----- $f -----"
              head -n 140 "$f"
            done
            echo ""
            echo "=== NATIVE_BUILD.SH ==="
            head -n 140 starling/packaging/android/native_build.sh
            echo ""
            echo "=== MOD-API-GEN / NATIVE-ROUTE ==="
            [ -f starling/docs/modding/src/concepts/native-route.md ] && head -n 120 starling/docs/modding/src/concepts/native-route.md
          } > starling-import-check.txt
          ls -lh starling-import-check.txt

      - name: Upload Import Check Artifact
        uses: actions/upload-artifact@v4
        with:
          name: starling-import-check
          path: starling-import-check.txt


