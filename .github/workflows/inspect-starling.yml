name: Inspect Starling Preview 4 Mod API

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-starling.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Starling Preview 4 (shallow)
        run: |
          git clone --depth 1 --branch preview-2026.11.23.4 https://github.com/starling-client/starling.git starling

      - name: Dump Sunrise Modding Spec & Examples
        run: |
          {
            echo "=== LLMS.TXT ==="
            [ -f starling/docs/modding/src/llms.txt ] && cat starling/docs/modding/src/llms.txt
            echo ""
            echo "=== FOR-AGENTS.MD ==="
            [ -f starling/docs/modding/src/for-agents.md ] && cat starling/docs/modding/src/for-agents.md
            echo ""
            echo "=== MODDING EXAMPLES LIST ==="
            find starling/docs/modding/examples -maxdepth 3 -type f 2>/dev/null | sort
            echo ""
            echo "=== FIRST-MOD.MD ==="
            [ -f starling/docs/modding/src/start/first-mod.md ] && head -n 200 starling/docs/modding/src/start/first-mod.md
            echo ""
            echo "=== NATIVE-ROUTE MIXINS ==="
            for f in starling/docs/modding/src/concepts/native-route/*.md; do
              [ -f "$f" ] && echo "----- $f -----" && head -n 120 "$f"
            done
          } > sunrise-mod-spec.txt
          ls -lh sunrise-mod-spec.txt

      - name: Upload Sunrise Mod Spec
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-mod-spec
          path: sunrise-mod-spec.txt
