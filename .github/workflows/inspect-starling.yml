name: Inspect Starling Preview 4 Mod API

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-starling.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Starling Preview 4 (shallow)
        run: |
          git clone --depth 1 --branch preview-2026.11.23.4 https://github.com/starling-client/starling.git starling

      - name: Locate Native Hooks & Game Modules
        run: |
          {
            echo "=== WHERE NATIVE_* FUNCTIONS LIVE ==="
            grep -rn "fn native_\(mods\|settings\|settings_click\|key\|frame\|hud\|commands\|command\|camera_pose_now\|screen_\)" starling/crates/sunrise-client/src/ | sort
            echo ""
            echo "=== GAME.RS (first 120 lines) ==="
            head -n 120 starling/crates/sunrise-client/src/game.rs
            echo ""
            echo "=== BUILD.RS (first 120 lines) ==="
            head -n 120 starling/crates/sunrise-client/build.rs
            echo ""
            echo "=== NATIVE_COMPAT.RS (if present, first 120 lines) ==="
            for f in $(find starling/crates/sunrise-client/src -name "native_compat.rs" -o -name "native_hooks.rs"); do
              echo "----- $f -----"
              head -n 120 "$f"
            done
          } > starling-hooks-map.txt
          ls -lh starling-hooks-map.txt

      - name: Upload Hooks Map
        uses: actions/upload-artifact@v4
        with:
          name: starling-hooks-map
          path: starling-hooks-map.txt
