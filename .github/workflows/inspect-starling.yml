name: Inspect Starling Preview 4 Mod API

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-starling.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Starling Preview 4 (shallow)
        run: |
          git clone --depth 1 --branch preview-2026.11.23.4 https://github.com/starling-client/starling.git starling

      - name: Dump Native Mod Format & Example
        run: |
          {
            echo "=== WRENCH EXAMPLE FILES ==="
            for f in $(find starling/native-mods/wrench -type f | sort); do
              echo "----- $f -----"
              cat "$f"
              echo ""
            done

            echo "=== STARLING CATALOG DOC ==="
            [ -f starling/docs/starling-catalog.md ] && cat starling/docs/starling-catalog.md

            echo "=== HOW-TO NATIVE MODS ==="
            [ -f starling/docs/modding/src/how-to/native-mods.md ] && head -n 220 starling/docs/modding/src/how-to/native-mods.md

            echo "=== PACKAGING/ANDROID ==="
            ls -la starling/packaging/android

            echo "=== CHECK ATLAS/MINIMAP IN STARLING ==="
            grep -rn -i "atlas\|worldmap" starling/docs/starling-catalog.md starling/packaging/android/ 2>/dev/null | head -n 40
          } > starling-mod-format.txt
          ls -lh starling-mod-format.txt

      - name: Upload Mod Format Artifact
        uses: actions/upload-artifact@v4
        with:
          name: starling-mod-format
          path: starling-mod-format.txt

