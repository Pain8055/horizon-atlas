name: Build & Check Atlas for Starling Preview 4

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-atlas.yml"
      - "mixins/**"

jobs:
  check-atlas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout horizon-atlas
        uses: actions/checkout@v4
        with:
          path: atlas-repo

      - name: Install Linux deps & Rust
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libudev-dev pkg-config
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      - name: Clone Starling Preview 4
        run: |
          git clone --depth 1 --branch preview-2026.11.23.4 https://github.com/starling-client/starling.git starling

      - name: Apply Mixins & Cargo Check
        run: |
          set -u
          LOG="$PWD/atlas-check-log.txt"
          : > "$LOG"

          MIXINS_GIT="https://github.com/horizon-rust/horizon-mixins"
          MIXINS_REV="5a64af938ec86b00d53d16a408aabc0038fb3e57"

          echo "=== 1. Install horizon-mixins ===" | tee -a "$LOG"
          cargo install --locked --git "$MIXINS_GIT" --rev "$MIXINS_REV" --root "$PWD/tools" horizon-mixins-cli 2>&1 | tail -n 15 | tee -a "$LOG"

          COMMIT=$(git -C starling rev-parse HEAD)
          export SUNRISE_GAME_BUILD_ID="$COMMIT"
          echo "Starling commit: $COMMIT" | tee -a "$LOG"

          mkdir -p work/source work/mods
          git -C starling archive --format=tar HEAD | tar -x -C work/source
          find work/source -type l -delete
          echo "$COMMIT" > work/source/.horizon-revision

          MANIFEST="crates/sunrise-android/Cargo.toml"
          sed -i 's|^path = "../sunrise-client/src/android_lib.rs"$|path = "plan-stub.rs"|' "work/source/$MANIFEST"
          : > work/source/crates/sunrise-android/plan-stub.rs
          grep -vxF '#![cfg_attr(not(target_os = "android"), forbid(unsafe_code))]' work/source/crates/sunrise-client/src/lib.rs > work/lib.rs
          cp work/lib.rs work/source/crates/sunrise-client/src/lib.rs

          echo "=== 2. Fetch crates & prep source ===" | tee -a "$LOG"
          cargo fetch --locked --manifest-path work/source/Cargo.toml >> "$LOG" 2>&1
          python3 starling/packaging/android/native_mixins_source.py work/source 2>&1 | tee -a "$LOG"

          echo "=== 3. Adapt horizon-atlas for Starling ===" | tee -a "$LOG"
          cp -r atlas-repo/mixins/atlas work/mods/atlas
          sed -i -E "s|^horizon_revision = \"[0-9a-f]*\"|horizon_revision = \"$COMMIT\"|" work/mods/atlas/horizon-mixin.toml
          python3 starling/packaging/android/native_mod_adapt.py work/source work/mods 2>&1 | tee -a "$LOG"

          # Fix remaining horizon -> sunrise crate and file paths
          sed -i 's|crates/horizon-client/|crates/sunrise-client/|g' work/mods/atlas/horizon-mixin.toml
          for f in work/mods/atlas/*.toml work/mods/atlas/*.rs; do
            sed -i \
              -e 's|horizon_client::|sunrise_client::|g' \
              -e 's|horizon_assets::|sunrise_assets::|g' \
              -e 's|horizon_core::|sunrise_core::|g' \
              -e 's|horizon_world::|sunrise_world::|g' \
              "$f"
          done

          echo "=== 4. Apply horizon-mixins ===" | tee -a "$LOG"
          "$PWD/tools/bin/horizon-mixins" apply --workspace work/source --mods work/mods --out work/stage 2>&1 | tee -a "$LOG"
          APPLY_STATUS=${PIPESTATUS[0]}
          echo "APPLY_STATUS=$APPLY_STATUS" | tee -a "$LOG"

          if [ "$APPLY_STATUS" -eq 0 ]; then
            git -C starling show "HEAD:$MANIFEST" > "work/stage/$MANIFEST"
            rm -f work/stage/crates/sunrise-android/plan-stub.rs work/stage/native-hooks.json

            echo "=== 5. Cargo Check sunrise-client ===" | tee -a "$LOG"
            (cd work/stage && cargo check --offline -p sunrise-client --message-format short 2>&1) | tee -a "$LOG"
            CHECK_STATUS=${PIPESTATUS[0]}
            echo "CHECK_STATUS=$CHECK_STATUS" | tee -a "$LOG"

            echo "=== 6. Package sunrise-native .hnmod ===" | tee -a "$LOG"
            python3 - "$PWD/work/mods/atlas" "$PWD/atlas-starling-preview4.hnmod" "$MIXINS_REV" << 'PYEOF'
          import json, pathlib, sys, zipfile
          src, out, mixins_rev = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]), sys.argv[3]
          manifest = {
            "schema": 1,
            "id": "atlas",
            "version": "0.2.0-starling",
            "game": "26.3",
            "mixins": mixins_rev,
          }
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
            z.writestr("sunrise-native.json", json.dumps(manifest, indent=2) + "\n")
            for p in sorted(src.rglob("*")):
              if p.is_file():
                z.write(p, f"mixins/atlas/{p.relative_to(src).as_posix()}")
          print("Packaged:", out)
          PYEOF
          fi

      - name: Upload Check Log & Adapted Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-check-output
          path: |
            atlas-check-log.txt
            atlas-starling-preview4.hnmod
          if-no-files-found: ignore
